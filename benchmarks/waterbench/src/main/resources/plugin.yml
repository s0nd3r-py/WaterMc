name: WaterBench
version: 1.0.0
main: org.watermc.bench.WaterBenchPlugin
api-version: '1.21'
description: Reproducible tick/GC/allocation benchmark for Leaf and Water
commands:
  wbench:
    description: Run benchmark scenarios
    usage: /wbench run <idle:60,entities:1500:120,tnt:5:14,chunkgen:20> [label] | /wbench status
    permission: waterbench.admin
permissions:
  waterbench.admin:
    default: op
